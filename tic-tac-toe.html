<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe GW</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css">
</head>

<body class="text-white p-3">

    <!-- HEADER -->
    <div id="header" class="container-md text-center p-2">
        <div class="row">
            <div class="col pt-2"></div>
            <div class="col pt-2">

            </div>
            <div class="col pt-2"></div>
        </div>

        <div class="row pt-2">
            <div class="col">
                <h1 class="m-3">Tic-Tac-Toe</h1>
            </div>
        </div>

        <div id="player-title" class="row pt-2">

            <div id="p1" class="col display-6 fs-4 container-sm">Player 1</div>
            <div class="col-1 display-6 fs-4"></div>
            <div id="p2" class="col display-6 fs-4 container-sm">Player 2</div>

        </div>

        <!-- IMAGES FOR PLAYERS -->
        <div class="row pt-2">

            <div id="imageP1Div" class="col display-6 fs "><img id="imageP1" src="images/x-neon.png" alt="neon blue x"></div>
            <div class="col-1 display-6 fs-4"></div>
            <div id="imageP2Div" class="col display-6 fs-4"><img id="imageP2" src="images/o-neon.png" alt="neon pink o"></div>

        </div>



    </div>

    <!-- ALERTS -->


    <div id="alert-container" class="col container-sm ">

        <div id="alertStart" role="alert"></div>

        <div id="alertWinner" role="alert"></div>

        <div id="alertDraw" role="alert"></div>


    </div>






    <!-- GRID -->

    <div class="container m-auto p-3 g-5">
        <div id="grid"
            class="container-outline-light m-auto p-0 text-info text-center align-middle border border-info rounded">
            <div class="row fs-1 g-0">
                <div id="box0" data-index="0" class="box col p-3 border border-info"></div>
                <div id="box1" data-index="1" class="box col p-3 border border-info"></div>
                <div id="box2" data-index="2" class="box col p-3 border border-info"></div>
            </div>
            <div class="row fs-1 g-0">
                <div id="box3" data-index="3" class="box col p-3 border border-info"></div>
                <div id="box4" data-index="4" class="box col p-3 border border-info"></div>
                <div id="box5" data-index="5" class="box col p-3 border border-info"></div>
            </div>
            <div class="row fs-1 g-0">
                <div id="box6" data-index="6" class="box col p-3 border border-info"></div>
                <div id="box7" data-index="7" class="box col p-3 border border-info"></div>
                <div id="box8" data-index="8" class="box col p-3 border border-info"></div>
            </div>
        </div>
    </div>

    <!-- BUTTONS -->
    <div class="d-grid col-2 gap-3 mx-auto pt-4 "> <!-- buttons take up 3 columns in the grid because we put col-2 -->
        <button id="startBtn" type="button" class="btn btn-info text-white">START</button>
        <button id="resetBtn" type="button" class="btn btn-outline-info text-white">RESET</button>
    </div>

    <script src="node_modules/bootstrap/dist/js/bootstrap.bundle.js"></script>
    <script src="node_modules/jquery/dist/jquery.js"></script>
    <script src="index_draft_4_fade.js"></script>
</body>

</html>
